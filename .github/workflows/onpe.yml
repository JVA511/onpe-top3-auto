name: Actualizador ONPE Doble

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: |
          pip install requests gspread google-auth playwright beautifulsoup4 lxml
          playwright install chromium
          
      - name: 1. Descargar Top 3 (main.py)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python main.py
        
      - name: 2. Descargar Actas (actas.py)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python actas.py
